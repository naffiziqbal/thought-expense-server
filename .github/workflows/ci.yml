name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and API tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thoughtexpense
          POSTGRES_PASSWORD: password
          POSTGRES_DB: thoughtexpense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thoughtexpense -d thoughtexpense"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://thoughtexpense:password@localhost:5432/thoughtexpense?schema=public
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRES_IN: 7d
      REVENUECAT_WEBHOOK_AUTH: ci-webhook-auth

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  merge-to-main:
    name: Merge dev into main
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fast-forward main to passing dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          git merge --ff-only origin/dev
          git push origin main

  deploy:
    name: Build on VPS
    needs: [test, merge-to-main]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.test.result == 'success' &&
      (
        (github.ref == 'refs/heads/dev' && needs.merge-to-main.result == 'success') ||
        (github.ref == 'refs/heads/main' && needs.merge-to-main.result == 'skipped')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Pull, generate, and build on VPS
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /var/www/personal/thoughtExpense/thought-expense-server
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            pnpm install --frozen-lockfile
            pnpm prisma generate
            pnpm build
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart thoughtexpense-server || pm2 restart all
            else
              echo "Build finished. Restart the Node process on the VPS if it does not pick up dist/."
            fi
