name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and API tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thoughtexpense
          POSTGRES_PASSWORD: password
          POSTGRES_DB: thoughtexpense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thoughtexpense -d thoughtexpense"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Sign-in and password-reset limits count attempts in Redis and refuse to
      # run without it, so their tests need a real instance.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://thoughtexpense:password@localhost:5432/thoughtexpense?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRES_IN: 7d
      REVENUECAT_WEBHOOK_AUTH: ci-webhook-auth

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  deploy:
    name: Build on VPS
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Pull, generate, and build on VPS
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /var/www/personal/thoughtExpense/thought-expense-server
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            pnpm install --frozen-lockfile
            # Apply committed migrations only (never db push / migrate reset here).
            # Fails the deploy — leaving the running server untouched — if prod can't migrate.
            pnpm exec prisma migrate deploy
            pnpm prisma generate
            pnpm build
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart thought-server || pm2 restart 7
            else
              echo "Build finished. Restart the Node process on the VPS if it does not pick up dist/."
            fi
