# Pinned so compose does not default the project name to the directory name
# ("server"), which collides with other projects and makes compose adopt or
# destroy their containers. Production overrides it with
# COMPOSE_PROJECT_NAME=thought-expense-server in .env, which owns its volumes.
name: thoughtexpense

services:
  postgres:
    image: postgres:16-alpine
    container_name: thoughtexpense-postgres
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1 so only this machine can connect — Docker's port rules
      # bypass ufw otherwise. Host port defaults to 5433 to stay clear of a native
      # Postgres on 5432; production sets POSTGRES_HOST_PORT=5432 in .env.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    environment:
      POSTGRES_USER: thoughtexpense
      # Read from .env next to this file. Only applies when the volume is first
      # created; to change it later run ALTER USER inside the container.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: thoughtexpense
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U thoughtexpense']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: thoughtexpense-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      # Localhost only, like Postgres above.
      - '127.0.0.1:6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
