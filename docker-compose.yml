# Pinned so compose does not default the project name to the directory name
# ("server"), which collides with other projects and makes compose adopt or
# destroy their containers.
name: thoughtexpense

services:
  postgres:
    image: postgres:16-alpine
    container_name: thoughtexpense-postgres
    restart: unless-stopped
    ports:
      # 5433 on the host to match DATABASE_URL in .env, and to stay clear of
      # any native Postgres already bound to 5432.
      - "5433:5432"
    environment:
      POSTGRES_USER: thoughtexpense
      POSTGRES_PASSWORD: password
      POSTGRES_DB: thoughtexpense
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thoughtexpense"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: thoughtexpense-redis
    restart: unless-stopped
    ports:
    - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
